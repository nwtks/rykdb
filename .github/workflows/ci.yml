name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build -t:Rebuild

      - name: Test
        run: dotnet test --no-build

      - name: Fantomas check
        run: dotnet fantomas --check src/ tests/

      - name: TailAudit
        run: dotnet run --project tools/TailAudit
